# Git hooks. Activate with `lefthook install` once the toolchain is present.
#
# Requires gitleaks >= 8.20 — the `git --pre-commit --staged` path was broken
# in 8.19 for repos without a full blob/tree history (gitleaks#1532).
#
# Both stages go through scripts/gitleaks-scan.sh, which separates "secret
# found" (exit 1) from "scanner could not run" (exit 2). Both still block, but
# only one of them means rotate a credential. fail_text below stays neutral
# because lefthook prints it for either case.

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: scripts/gitleaks-scan.sh staged
      fail_text: "Staged-change secret scan did not pass. Read the message above before bypassing."

    # Enabled during the workspace scaffold, once pnpm and eslint exist.
    # typecheck:
    #   glob: "*.{ts,tsx}"
    #   run: pnpm -w exec tsc --noEmit
    # lint:
    #   glob: "*.{ts,tsx}"
    #   run: pnpm -w exec eslint {staged_files}

pre-push:
  commands:
    gitleaks-history:
      run: scripts/gitleaks-scan.sh history
      fail_text: "History secret scan did not pass. Read the message above before bypassing."

    # Enabled during the workspace scaffold.
    # test:
    #   run: pnpm -w test
